# SeekNSee v0.2.5 — scientific regression gate.
# Initial CI: Linux + R 4.5.0. This is not multi-platform packaging validation.
# Dependencies are restored from the reviewed renv.lock.
name: Scientific validation (R)

on:
  pull_request:
  push:
    branches:
      - main
      - chore/publication-prep
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scientific-validation:
    name: R 4.5.0 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true

      - name: Restore dependencies from renv.lock
        uses: r-lib/actions/setup-renv@v2

      - name: Verify restored package versions
        shell: Rscript {0}
        run: |
          lock <- jsonlite::fromJSON("renv.lock")
          for (pkg in c("shiny", "dplyr", "stringr", "writexl")) {
            actual <- as.character(utils::packageVersion(pkg))
            expected <- lock$Packages[[pkg]]$Version
            stopifnot(identical(actual, expected))
            cat(pkg, actual, "matches renv.lock\n")
          }

      - name: Verify application syntax and metadata
        shell: Rscript {0}
        run: |
          invisible(parse(file = 'app/app.R'))
          expected <- trimws(readLines('VERSION', warn = FALSE))
          stopifnot(identical(expected, '0.2.5'))
          cat('PASS syntax and declared version\n')

      - name: Verify frozen scientific snapshot
        shell: bash
        run: |
          test -f tests/scientific_regression/v0.2.5_full_outputs.rds
          echo 'Expected SHA-256: 689c7b71785f0a42782ec5801f29898799dfac66ccce76b406e1f60faf44c83b'
          echo '689c7b71785f0a42782ec5801f29898799dfac66ccce76b406e1f60faf44c83b  tests/scientific_regression/v0.2.5_full_outputs.rds' | sha256sum --check --status
          echo 'PASS frozen scientific snapshot SHA-256'

      - name: Run baseline scientific assertions
        run: Rscript tests/scientific_regression/test_baseline.R

      - name: Run edge-case scientific assertions
        run: Rscript tests/scientific_regression/test_edge_cases.R

      - name: Compare complete scientific tables against baseline
        run: Rscript tests/scientific_regression/compare_full_outputs.R compare
